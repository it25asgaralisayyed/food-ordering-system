<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Food Ordering System</title>
    <style>
        body { font-family: Arial, sans-serif; background:#fff3e0; text-align:center; }
        form { background:#fff; width:350px; margin:40px auto; padding:25px;
               border-radius:10px; box-shadow:0 0 10px #bbb; }
        input, select { width:90%; padding:8px; margin:8px 0; }
        button { background:#e65100; color:#fff; padding:10px 20px; border:none; cursor:pointer; }
    </style>
</head>
<body>
    <h1 id="heading">Online Food Ordering System</h1>
    <form action="/order" method="post">
        <label>Your Name</label><br>
        <input type="text" id="customerName" name="customerName" required><br>

        <label>Select Item</label><br>
        <select id="item" name="item">
            <option>Margherita Pizza</option>
            <option>Veg Burger</option>
            <option>Paneer Wrap</option>
            <option>Masala Dosa</option>
        </select><br>

        <label>Quantity</label><br>
        <input type="number" id="quantity" name="quantity" value="1" min="1" required><br>

        <button type="submit" id="placeOrderBtn">Place Order</button>
    </form>
</body>
</html>
